name: Legacy Healing Calls Sync

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force re-fetch all cached days (true/false)'
        required: false
        default: 'false'

concurrency:
  group: legacy-healing-calls-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore call cache
        uses: actions/cache@v4
        with:
          path: output/legacy_healing_cache
          key: legacy-healing-cache-${{ github.run_id }}
          restore-keys: |
            legacy-healing-cache-

      - name: Sync calls to Google Sheets
        env:
          CTM_API_HOST: https://api.calltrackingmetrics.com
          CTM_ACCESS_KEY: ${{ secrets.CTM_ACCESS_KEY }}
          CTM_SECRET_KEY: ${{ secrets.CTM_SECRET_KEY }}
          CTM_ACCOUNT_ID: ${{ secrets.CTM_ACCOUNT_ID }}
          LEGACY_HEALING_SPREADSHEET_ID: ${{ secrets.LEGACY_HEALING_SPREADSHEET_ID }}
          LEGACY_HEALING_SHEET_NAME: ${{ vars.LEGACY_HEALING_SHEET_NAME || 'Calls' }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: python legacy_healing_firsttime_calls_sync.py
